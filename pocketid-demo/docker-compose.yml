# Pocket ID (passkey-only OIDC provider) for the login-takeover demo.
# Runs on 1412 so the demo app can own the public origin http://localhost:1411.
# Disposable: all state lives in the pocket-id-data volume.
#   docker compose up -d        # start
#   docker compose down -v      # wipe and reset
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket-id
    ports:
      - "127.0.0.1:1412:1411"
    env_file:
      - .env
    volumes:
      - pocket-id-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  pocket-id-data:
