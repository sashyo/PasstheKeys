<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" width="260" height="170" role="img" aria-label="Pass the Keys - a key made of macaroni">
  <defs>
    <linearGradient id="pasta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d998"/>
      <stop offset="0.5" stop-color="#ecc071"/>
      <stop offset="1" stop-color="#d7a04c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8a5a12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- the key, built from elbow-macaroni tubes: a C-shaped bow + a curved shaft with two teeth -->
  <g fill="none" stroke-linecap="butt" filter="url(#soft)">
    <!-- darker tube edge for depth -->
    <g stroke="#b5771f" stroke-width="29">
      <!-- bow: an elbow macaroni bent into a near-ring, with a gap (the open C) -->
      <path d="M86 56 A40 40 0 1 0 86 114"/>
      <!-- shaft: a gentle macaroni curve running to the teeth -->
      <path d="M96 85 C 128 76, 160 94, 212 85"/>
      <!-- teeth -->
      <path d="M186 85 L 186 116"/>
      <path d="M212 85 L 212 108"/>
    </g>
    <!-- macaroni body -->
    <g stroke="url(#pasta)" stroke-width="22">
      <path d="M86 56 A40 40 0 1 0 86 114"/>
      <path d="M96 85 C 128 76, 160 94, 212 85"/>
      <path d="M186 85 L 186 116"/>
      <path d="M212 85 L 212 108"/>
    </g>
    <!-- sheen along the top of each tube -->
    <g stroke="#fdefc9" stroke-width="5" opacity="0.8" transform="translate(0,-5)">
      <path d="M86 56 A40 40 0 1 0 86 114"/>
      <path d="M96 85 C 128 76, 160 94, 212 85"/>
    </g>
  </g>

  <!-- hollow tube mouths: the open ends that make it read as macaroni -->
  <g>
    <!-- top mouth of the C bow -->
    <ellipse cx="86" cy="56" rx="11" ry="7.5" fill="#9c6414" transform="rotate(-18 86 56)"/>
    <ellipse cx="86" cy="55" rx="6" ry="3.8" fill="#6f4209" transform="rotate(-18 86 56)"/>
    <!-- bottom mouth of the C bow -->
    <ellipse cx="86" cy="114" rx="11" ry="7.5" fill="#9c6414" transform="rotate(18 86 114)"/>
    <ellipse cx="86" cy="115" rx="6" ry="3.8" fill="#6f4209" transform="rotate(18 86 114)"/>
  </g>
</svg>
