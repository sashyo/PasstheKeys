<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" width="260" height="170" role="img" aria-label="Pass the Keys - a pasta noodle shaped like a key">
  <defs>
    <linearGradient id="pasta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d998"/>
      <stop offset="0.5" stop-color="#ecc071"/>
      <stop offset="1" stop-color="#d7a04c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8a5a12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- the key, drawn as one rounded pasta noodle: a coiled bow + a wavy shaft with two teeth -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- darker edge for depth -->
    <g stroke="#b5771f" stroke-width="27">
      <circle cx="62" cy="85" r="35"/>
      <path d="M97 85 C 123 58, 143 112, 169 85 S 211 85, 227 85"/>
      <path d="M197 85 L 197 120"/>
      <path d="M221 85 L 221 109"/>
    </g>
    <!-- noodle body -->
    <g stroke="url(#pasta)" stroke-width="20">
      <circle cx="62" cy="85" r="35"/>
      <path d="M97 85 C 123 58, 143 112, 169 85 S 211 85, 227 85"/>
      <path d="M197 85 L 197 120"/>
      <path d="M221 85 L 221 109"/>
    </g>
    <!-- sheen along the top edge -->
    <g stroke="#fdefc9" stroke-width="5" opacity="0.85" transform="translate(0,-5)">
      <circle cx="62" cy="85" r="35"/>
      <path d="M97 85 C 123 58, 143 112, 169 85 S 211 85, 227 85"/>
    </g>
  </g>
</svg>
